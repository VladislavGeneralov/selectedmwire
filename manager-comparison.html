<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Внутренний опрос: сравнение проволоки</title>
<style>
  :root{
    --bg:#f2f1ef; --panel:#ffffff; --panel2:#f2f1ef; --border:#e2e0dc;
    --text:#131110; --muted:#8a8681; --accent:#f5a812; --accent2:#d88f06; --radius:8px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:1.5rem;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 24px;font-size:.92rem}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
  select{width:100%;padding:9px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:.92rem}
  .btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button{border:none;border-radius:8px;padding:11px 16px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit}
  button.primary{background:var(--accent);color:#131110}
  button.primary:hover{filter:brightness(1.05)}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  button.ghost:hover{background:var(--panel2)}
  button:disabled{opacity:.4;cursor:not-allowed}

  .qcard{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .qcard:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .qtext{font-size:1rem;font-weight:600;margin-bottom:12px}
  .qtext .crit{color:var(--accent2);font-weight:800}

  .optRow{display:flex;gap:8px}
  .optBtn{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 10px;text-align:center;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--text)}
  .optBtn:hover{border-color:var(--accent)}
  .optBtn.chosen{background:var(--accent);border-color:var(--accent);color:#131110}
  .optBtn.dimmed{opacity:.4;cursor:default}
  .optBtn.dimmed:hover{border-color:var(--border)}

  table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:10px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600}
  .count{color:var(--accent2);font-weight:700}
  .empty{color:var(--muted);font-size:.85rem;padding:10px 0}

  .wireBlock{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
  .wireBlock:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .wireBlock h4{margin:0 0 8px;font-size:.95rem}
  .wireBlock .n{color:var(--muted);font-weight:400;font-size:.78rem}
  .barRow{display:grid;grid-template-columns:1fr 1fr 40px;align-items:center;gap:8px;font-size:.75rem;margin-bottom:4px}
  .barTrack{background:var(--panel2);border-radius:6px;height:9px;position:relative;overflow:hidden}
  .barFill{position:absolute;top:0;bottom:0;left:50%;background:var(--accent)}
  .barFill.neg{background:#b23a2f}
  .barFill.empty{background:var(--border);left:0;width:100%}

  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tabBtn{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.88rem;cursor:pointer}
  .tabBtn.active{background:var(--text);border-color:var(--text);color:#fff}

  .manualRow{display:grid;grid-template-columns:1fr 160px 30px;align-items:center;gap:10px;margin-bottom:8px}
  .manualRow span{font-size:.8rem}
  .manualRow input[type=range]{width:100%;accent-color:var(--accent)}
  .manualVal{font-weight:700;text-align:right;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="btnRow" style="margin:0 0 16px">
    <button class="ghost" id="downloadBtn">Скачать результаты</button>
    <button class="ghost" id="resetBtn">Сбросить всё</button>
  </div>

  <div class="tabs">
    <button class="tabBtn active" id="tabBtnCompare">Попарное сравнение</button>
    <button class="tabBtn" id="tabBtnManual">Параметры</button>
  </div>

  <div id="tab-compare">
    <div class="panel" id="blockPanel"></div>

    <div class="panel">
      <h3 style="margin-top:0">Сводка по проволокам</h3>
      <p class="sub" style="margin-bottom:14px">Среднее по всем собранным сравнениям для каждого критерия (от −1 до +1). Серая полоса — данных ещё нет.</p>
      <div id="wireSummary"></div>
    </div>

    <div class="panel">
      <h3 style="margin-top:0">Собранные ответы (<span class="count" id="cnt">0</span>)</h3>
      <div id="log"></div>
    </div>
  </div>

  <div id="tab-manual" style="display:none">
    <div class="panel" id="manualPanel"></div>
  </div>
</div>

<script>
// ARTACUT NEXT технически идентична исключённым "обычным" итальянским
// ARTACUT 1000/500/900Z — разница только в происхождении (Китай) и
// на порядок большем числе SKU на сайте (27 против 3).
const WIRES = [
  "Bedra AC CUT - медная проволока с сердечником CuZn20, покрытие CuZn50",
  "Bedra Broncocut - медная проволока с медным сердечником, покрытие латунь CuZn50",
  "Bedra Topas Plus - медная проволока с медным сердечником, покрытие двухслойная латунь с высоким содержанием цинка",
  "ARTACUT NEXT 1000 - латунная проволока твёрдая",
  "ARTACUT NEXT 500 - латунная проволока полутвёрдая",
  "ARTACUT NEXT 900Z - латунная проволока с цинковым покрытием, твёрдая",
  "ARTACUT NEO 1000 - латунная проволока твёрдая",
  "ARTACUT NEO 500 - латунная проволока полутвёрдая",
  "ARTACUT NEO Zshell 1000 - латунная проволока с цинковым покрытием (термодиффузия), твёрдая",
  "ARTACUT Viper 1000 - латунная проволока с цинковым покрытием (гальваника), твёрдая",
  "ARTACUT Falcon - латунная проволока с двухслойным цинковым покрытием",
  "ARTACUT LIZEL 1000 - латунная проволока твёрдая",
  "ARTACUT LIZEL 500 - латунная проволока полутвёрдая",
  "ARTACUT M - молибденовая проволока",
  "Sumi-Spark - латунная оцинкованная проволока со стальным сердечником",
  "Вольфрамовая проволока для микроэрозионной обработки"
];

const AXES = [
  {id:"load_capacity", label:"Повышенная стойкость к обрыву / нагрузке"},
  {id:"speed", label:"Подходит для высокоскоростной резки"},
  {id:"precision", label:"Подходит для высокоточной обработки"},
  {id:"surface_finish", label:"Обеспечивает высокое качество поверхности (Ra)"},
  {id:"fine_geometry", label:"Подходит для деталей со сложной / мелкой геометрией"},
  {id:"taper_fit", label:"Подходит для резки под углом более 10 градусов"},
  {id:"finish_role_fit", label:"Подходит для финишного прохода при многопроходной резки"},
  {id:"thickness_capacity", label:"Подходит для работы с толстой заготовкой / высокой нагрузкой / пакетной резкой"},
  {id:"micro_edm_fit", label:"Подходит для микроэрозионной обработки"}
];

// Ничего не сохраняется между обновлениями страницы — только скачивание файла.
let answers = [];

function axisLabel(id){ return AXES.find(a=>a.id===id)?.label || id; }

function randomWirePair(){
  const i = Math.floor(Math.random()*WIRES.length);
  let j = Math.floor(Math.random()*WIRES.length);
  while(j===i) j = Math.floor(Math.random()*WIRES.length);
  return [WIRES[i], WIRES[j]];
}
function randomAxisId(){ return AXES[Math.floor(Math.random()*AXES.length)].id; }

let currentQuestion = null;

function generateQuestion(){
  const [a,b] = randomWirePair();
  currentQuestion = {wireA:a, wireB:b, axis:randomAxisId()};
  renderQuestion();
}

function renderQuestion(){
  const panel = document.getElementById("blockPanel");
  const q = currentQuestion;
  const label = axisLabel(q.axis);
  const opts = [
    {key:"A", text:q.wireA},
    {key:"B", text:q.wireB},
    {key:"equal", text:"Одинаково"},
    {key:"unknown", text:"Не знаю"}
  ];
  panel.innerHTML = `<div class="qcard" style="margin:0;padding:0;border:none">
    <div class="qtext">Что лучше по критерию «<span class="crit">${label}</span>»: <b>${q.wireA}</b> или <b>${q.wireB}</b>?</div>
    <div class="optRow">
      ${opts.map(o=>`<button class="optBtn" data-key="${o.key}">${o.text}</button>`).join("")}
    </div>
  </div>`;

  panel.querySelectorAll(".optBtn").forEach(btn=>{
    btn.onclick = ()=>{
      answers.push({
        wireA:q.wireA, wireB:q.wireB, axis:q.axis, axisLabel:axisLabel(q.axis),
        answer:btn.dataset.key, timestamp:new Date().toISOString()
      });
      renderLog();
      renderWireSummary();
      generateQuestion();
    };
  });
}

function computeStats(){
  const stats = {};
  WIRES.forEach(w=>{
    stats[w] = {};
    AXES.forEach(a=> stats[w][a.id] = {sum:0, count:0});
  });
  answers.forEach(r=>{
    if(!stats[r.wireA] || !stats[r.wireB]) return;
    const sa = stats[r.wireA][r.axis], sb = stats[r.wireB][r.axis];
    if(!sa || !sb) return;
    if(r.answer === "A"){ sa.sum+=1; sb.sum-=1; sa.count+=1; sb.count+=1; }
    else if(r.answer === "B"){ sa.sum-=1; sb.sum+=1; sa.count+=1; sb.count+=1; }
    else if(r.answer === "equal"){ sa.count+=1; sb.count+=1; }
    // "unknown" не считается ни в чью пользу и не увеличивает count
  });
  return stats;
}

function renderWireSummary(){
  const stats = computeStats();
  const el = document.getElementById("wireSummary");
  el.innerHTML = WIRES.map(w=>{
    const totalN = AXES.reduce((n,a)=> n + stats[w][a.id].count, 0);
    const rows = AXES.map(a=>{
      const s = stats[w][a.id];
      if(s.count === 0){
        return `<div class="barRow">
          <div>${a.label}</div>
          <div class="barTrack"><div class="barFill empty"></div></div>
          <div>—</div>
        </div>`;
      }
      const avg = s.sum / s.count; // -1..+1
      const pct = Math.abs(avg) * 50;
      const side = avg >= 0 ? `left:50%;right:auto;width:${pct}%` : `left:auto;right:50%;width:${pct}%`;
      return `<div class="barRow">
        <div>${a.label}</div>
        <div class="barTrack"><div class="barFill${avg<0?' neg':''}" style="${side}"></div></div>
        <div>${avg>0?'+':''}${avg.toFixed(1)}</div>
      </div>`;
    }).join("");
    return `<div class="wireBlock">
      <h4>${w} <span class="n">(${totalN} сравнени${totalN===1?'е':totalN>=2&&totalN<=4?'я':'й'})</span></h4>
      ${rows}
    </div>`;
  }).join("");
}

function renderLog(){
  document.getElementById("cnt").textContent = answers.length;
  const log = document.getElementById("log");
  if(answers.length===0){ log.innerHTML = `<p class="empty">Пока нет ответов.</p>`; return; }
  const rows = answers.slice().reverse().slice(0,50).map(r=>`
    <tr>
      <td>${r.wireA}</td><td>${r.wireB}</td>
      <td>${r.axisLabel}</td>
      <td>${r.answer==="A"?r.wireA+" лучше":r.answer==="B"?r.wireB+" лучше":r.answer==="equal"?"Одинаково":"Не знаю"}</td>
    </tr>`).join("");
  log.innerHTML = `<table><thead><tr><th>A</th><th>B</th><th>Критерий</th><th>Ответ</th></tr></thead><tbody>${rows}</tbody></table>
    ${answers.length>50?`<p class="empty">Показаны последние 50 из ${answers.length}.</p>`:""}`;
}

generateQuestion();
renderLog();
renderWireSummary();

/* ==================== Вкладка 2: прямая настройка параметров ==================== */
// Ничего не сохраняется между обновлениями страницы — только скачивание файла.
let manualRatings = {};
WIRES.forEach(w=>{
  manualRatings[w] = {};
  AXES.forEach(a=> manualRatings[w][a.id] = 0);
});

function renderManualTab(){
  const el = document.getElementById("manualPanel");
  el.innerHTML = WIRES.map(w=>{
    const rows = AXES.map(a=>{
      const v = manualRatings[w][a.id];
      return `<div class="manualRow">
        <span>${a.label}</span>
        <input type="range" min="-2" max="2" step="1" value="${v}" data-wire="${w}" data-axis="${a.id}">
        <span class="manualVal" id="mval_${w}_${a.id}">${v>0?'+':''}${v}</span>
      </div>`;
    }).join("");
    return `<div class="wireBlock"><h4>${w}</h4>${rows}</div>`;
  }).join("");

  el.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.oninput = ()=>{
      const w = inp.dataset.wire, a = inp.dataset.axis;
      const v = Number(inp.value);
      manualRatings[w][a] = v;
      const valEl = document.getElementById(`mval_${w}_${a}`);
      valEl.textContent = (v>0?'+':'') + v;
    };
  });
}
renderManualTab();

/* ==================== переключение вкладок + общие кнопки ==================== */
let activeTab = "compare";
const tabBtnCompare = document.getElementById("tabBtnCompare");
const tabBtnManual = document.getElementById("tabBtnManual");
const tabCompare = document.getElementById("tab-compare");
const tabManual = document.getElementById("tab-manual");
tabBtnCompare.onclick = ()=>{
  activeTab = "compare";
  tabBtnCompare.classList.add("active"); tabBtnManual.classList.remove("active");
  tabCompare.style.display = "block"; tabManual.style.display = "none";
};
tabBtnManual.onclick = ()=>{
  activeTab = "manual";
  tabBtnManual.classList.add("active"); tabBtnCompare.classList.remove("active");
  tabCompare.style.display = "none"; tabManual.style.display = "block";
};

document.getElementById("downloadBtn").onclick = ()=>{
  const data = activeTab === "compare" ? answers : manualRatings;
  const filename = activeTab === "compare" ? "artacut_comparisons.json" : "artacut_manual_ratings.json";
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
};
document.getElementById("resetBtn").onclick = ()=>{
  if(activeTab === "compare"){
    if(confirm("Удалить все собранные ответы без возможности восстановления?")){
      answers = []; renderLog(); renderWireSummary();
    }
  } else {
    if(confirm("Сбросить все ручные оценки в 0?")){
      WIRES.forEach(w=> AXES.forEach(a=> manualRatings[w][a.id] = 0));
      renderManualTab();
    }
  }
};
</script>
</body>
</html>
